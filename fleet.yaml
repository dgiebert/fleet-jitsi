defaultNamespace: jitsi

helm:
  repo: https://jitsi-contrib.github.io/jitsi-helm/
  chart: jitsi-meet
  releaseName: jitsi-meet
  version: 3.6.0
  values:
    publicURL: https://meet.giebert.dev
    web:
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        hosts:
          - host: "meet.giebert.dev"
            paths:
              - "/"
        tls:
        - secretName: jitsi-web-tls
          hosts:
            - "meet.giebert.dev"