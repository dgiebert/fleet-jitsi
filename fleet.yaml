defaultNamespace: jitsi

helm:
  repo: https://jitsi-contrib.github.io/jitsi-helm/
  chart: jitsi-meet
  releaseName: jitsi-meet
  version: 3.6.0
  values:
    publicURL: https://meet.giebert.dev
    turnHost: "meet.giebert.dev:5349"
    jvb:
      useNodeIP: true
      useInternalStun: false
      stunServers: "meet-jit-si-turnrelay.jitsi.net:443"
      useHostPort: true
    web:
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        hosts:
          - host: "meet.giebert.dev"
            paths:
              - "/"
        tls:
        - secretName: jitsi-web-tls
          hosts:
            - "meet.giebert.dev"
    coturn:
      enabled: true
      turns:
        enabled: true
        certificate:
          issuerRef:
            name: letsencrypt
      service:
          ports:
            turns: 5349